<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novinky třídy</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 20px 0;
        }
        main {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
            text-align: center;
        }
        .news-item {
            background-color: white;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #45a049;
        }
        footer {
            text-align: center;
            padding: 15px;
            background-color: #eee;
            margin-top: 30px;
            border-top: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <header>
        <h1>Novinky třídy 🏫</h1>
    </header>

    <main>
        <button onclick="novinkaDne()">🎉 Novinka dne!</button>
        <div id="news" class="news-item">
            <h2>Novinka dne 🌟</h2>
            <p>Klikněte na tlačítko pro zobrazení nové novinky nebo tipů.</p>
        </div>
    </main>

    <footer>
        &copy; 2025 Váš Třída Novinky
    </footer>

    <script>
        const novinky = [
            "Dobry den, připomínam že zitra jdeme do čapkarnz na den otevřenych dveři. 
			Bude to na 3 a 4 hodinu. Ještě zita mame vyměnu hodin, misto matiky, mame fyziku.",
            "Motorkář se dostane do pekla a najednou se potká s Hitlerem.
Hitler se ptá: "Jak ses sem dostal mladej?"
Motorkář: "Stejně jako ty! Mooooc plynu!"
Vim že to není vtipne, ale doufam že jsem zlepšil vam naladu"
        ];

        function novinkaDne() {
            const index = Math.floor(Math.random() * novinky.length);
            document.getElementById("news").innerHTML = `<h2>Novinka dne 🌟</h2><p>${novinky[index]}</p>`;
        }
    </script>
</body>
</html>
